{% extends "dashboard/base.html" %}

{% block title %}Change Password | Trip Planner{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">
            <i class="bi bi-shield-lock"></i> Change Password
        </h1>
        <p class="page-subtitle">Update your account password</p>
    </div>
    <a href="{% url 'profile' %}" class="btn btn-outline-secondary">
        <i class="bi bi-person-lines-fill me-1"></i> My Profile
    </a>
</div>

{% if success %}
<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>{{ success }}</div>
{% endif %}
{% if error %}
<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>{{ error }}</div>
{% endif %}

<div class="card form-card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-lock me-1"></i>New Password</label>
                <input type="password" name="new_password" class="form-control"
                       placeholder="Enter new password" required>
            </div>
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-lock-fill me-1"></i>Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control"
                       placeholder="Re-enter new password" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-shield-check me-1"></i> Update Password
            </button>
        </form>
    </div>
</div>

{% endblock %}
