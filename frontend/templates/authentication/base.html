<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Trip Planner{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #16a34a;
            --primary-dark: #15803d;
            --primary-light: #dcfce7;
            --border: #e5e7eb;
            --text: #1a1a1a;
            --text-muted: #6b7280;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #fafaf8; }

        .auth-stage {
            min-height: 100vh;
            background: linear-gradient(135deg, #14532d 0%, #16a34a 50%, #22c55e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-wrap {
            display: flex;
            gap: 40px;
            align-items: center;
            max-width: 960px;
            width: 100%;
        }
        .auth-poster {
            flex: 1;
            color: #fff;
            padding: 24px;
        }
        .poster-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 40px;
            opacity: .9;
        }
        .poster-brand i { font-size: 1.5rem; }
        .poster-tag {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .1em;
            opacity: .7;
            display: block;
            margin-bottom: 12px;
        }
        .poster-title {
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
        }
        .poster-title span { opacity: .75; }
        .poster-sub {
            font-size: 15px;
            opacity: .8;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .poster-stats { display: flex; gap: 24px; flex-wrap: wrap; }
        .poster-stat { display: flex; align-items: center; gap: 10px; }
        .poster-stat i { font-size: 1.3rem; opacity: .8; }
        .poster-stat strong { display: block; font-size: 1rem; font-weight: 700; }
        .poster-stat span { font-size: 12px; opacity: .7; }

        .auth-card {
            width: 400px;
            border-radius: 18px !important;
            border: none !important;
            box-shadow: 0 20px 60px rgba(0,0,0,.15) !important;
            background: #ffffff;
        }
        .logo-circle {
            width: 52px;
            height: 52px;
            background: var(--primary-light);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 16px;
        }
        .auth-title { font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .auth-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }

        .form-label { font-size: 13px; font-weight: 600; color: var(--text); }

        .form-control, .form-select {
            border: 1.5px solid var(--border);
            border-radius: 9px;
            padding: 10px 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22,163,74,.12);
        }
        .input-group-text {
            background: #fafaf8;
            border: 1.5px solid var(--border);
            border-right: none;
            border-radius: 9px 0 0 9px;
            color: var(--text-muted);
        }
        .input-group .form-control { border-radius: 0 9px 9px 0; }

        .btn-primary {
            background: var(--primary) !important;
            border: none !important;
            border-radius: 9px !important;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            padding: 11px 20px;
            box-shadow: 0 2px 8px rgba(22,163,74,.25);
        }
        .btn-primary:hover { background: var(--primary-dark) !important; }

        .divider {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin: 20px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 38%;
            height: 1px;
            background: var(--border);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .auth-footer { text-align: center; font-size: 13px; color: var(--text-muted); }
        .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }

        .alert-danger { background: #fef2f2; color: #b91c1c; border: none; border-radius: 9px; }

        @media (max-width: 768px) {
            .auth-poster { display: none; }
            .auth-card { width: 100%; }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
