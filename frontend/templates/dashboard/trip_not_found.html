{% extends "dashboard/base.html" %}

{% block title %}Trip Not Found | Trip Planner{% endblock %}

{% block content %}

<div class="not-found">
    <div class="big-404">404</div>

    <i class="bi bi-compass" style="font-size:64px; color: var(--coral); display:block; margin-bottom:14px;"></i>

    <h3>Looks like you're off the map</h3>
    <p>The trip you're looking for doesn't exist or has been removed.</p>

    <a href="{% url 'trip-list' %}" class="btn btn-primary">
        <i class="bi bi-arrow-left me-1"></i>
        Back to My Trips
    </a>
</div>

{% endblock %}
